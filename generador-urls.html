<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMAC · Generador de URLs</title>
    <meta name="theme-color" content="#020617">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #020617;
            --bg-soft: #0f172a;
            --panel: #111827;
            --panel-2: #1e293b;
            --line: #334155;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --green: #22c55e;
            --green-dark: #15803d;
            --cyan: #22d3ee;
            --blue: #3b82f6;
            --amber: #f59e0b;
            --red: #ef4444;
            --radius: 18px;
            --shadow: 0 18px 48px rgba(0,0,0,0.35);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #0b1220 0%, #020617 45%, #000000 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 18px;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(17,24,39,0.98));
            border: 1px solid rgba(51,65,85,0.9);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
        }

        .header h1 {
            font-size: 1.55rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #a5b4fc;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .panel {
            background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(17,24,39,0.98));
            border: 1px solid rgba(51,65,85,0.9);
            border-radius: 22px;
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
        }

        .panel-title {
            font-size: 0.95rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 14px;
        }

        .config-grid,
        .stats-grid,
        .filter-grid {
            display: grid;
            gap: 12px;
        }

        .config-grid {
            grid-template-columns: 1.4fr auto auto;
            align-items: end;
        }

        .stats-grid {
            grid-template-columns: repeat(5, 1fr);
        }

        .filter-grid {
            grid-template-columns: 1.2fr 1fr 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.82rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        input, select {
            width: 100%;
            background: rgba(15,23,42,0.95);
            color: var(--text);
            border: 1px solid rgba(51,65,85,0.95);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: rgba(59,130,246,0.95);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .btn {
            border: 1px solid rgba(51,65,85,0.9);
            background: linear-gradient(180deg, rgba(30,41,59,0.95), rgba(15,23,42,0.98));
            color: var(--text);
            border-radius: 14px;
            padding: 12px 14px;
            cursor: pointer;
            font-size: 0.92rem;
            font-weight: 600;
            transition: 0.2s ease;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-1px);
            border-color: rgba(59,130,246,0.9);
        }

        .btn-green {
            background: linear-gradient(135deg, rgba(34,197,94,0.22), rgba(21,128,61,0.18));
            border-color: rgba(34,197,94,0.5);
        }

        .btn-blue {
            background: linear-gradient(135deg, rgba(59,130,246,0.22), rgba(37,99,235,0.18));
            border-color: rgba(59,130,246,0.5);
        }

        .btn-amber {
            background: linear-gradient(135deg, rgba(245,158,11,0.20), rgba(120,53,15,0.18));
            border-color: rgba(245,158,11,0.45);
        }

        .btn-small {
            padding: 8px 10px;
            font-size: 0.82rem;
            border-radius: 10px;
        }

        .stat-card {
            background: rgba(15,23,42,0.92);
            border: 1px solid rgba(51,65,85,0.9);
            border-radius: 16px;
            padding: 14px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--text);
        }

        .export-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .urls-container {
            display: grid;
            gap: 14px;
        }

        .url-card {
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(51,65,85,0.9);
            border-radius: 18px;
            padding: 16px;
        }

        .url-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .user-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text);
        }

        .user-meta {
            margin-top: 6px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .pill-blue {
            color: #dbeafe;
            background: rgba(59,130,246,0.18);
            border: 1px solid rgba(59,130,246,0.4);
        }

        .pill-green {
            color: #dcfce7;
            background: rgba(34,197,94,0.18);
            border: 1px solid rgba(34,197,94,0.4);
        }

        .pill-amber {
            color: #fde68a;
            background: rgba(245,158,11,0.18);
            border: 1px solid rgba(245,158,11,0.4);
        }

        .url-display {
            background: rgba(2,6,23,0.9);
            border: 1px solid rgba(51,65,85,0.9);
            border-radius: 12px;
            padding: 12px;
            color: #93c5fd;
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            margin-bottom: 12px;
        }

        .url-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .accesses-grid {
            display: grid;
            gap: 8px;
        }

        .access-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(30,41,59,0.45);
            border: 1px solid rgba(51,65,85,0.75);
        }

        .access-row strong {
            color: #86efac;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--muted);
            border: 1px dashed rgba(51,65,85,0.9);
            border-radius: 16px;
            background: rgba(15,23,42,0.6);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 1100px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .config-grid,
            .filter-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            body {
                padding: 10px;
            }

            .header,
            .panel {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>MEMAC · Generador de URLs</h1>
            <p>Generación y exportación de accesos para clientes multi-válvula</p>
        </header>

        <section class="panel">
            <div class="panel-title">Configuración del servidor</div>
            <div class="config-grid">
                <div class="form-group">
                    <label for="base-url">URL base de la app cliente</label>
                    <input type="text" id="base-url" value="http://localhost:1880/index-4.html" placeholder="https://tu-dominio.com/index-4.html">
                </div>
                <button class="btn btn-green" onclick="generarURLs()">🔗 Generar URLs</button>
                <button class="btn" onclick="limpiarResultados()">Limpiar</button>
            </div>
        </section>

        <section id="stats-section" class="panel hidden">
            <div class="panel-title">Resumen generado</div>
            <div class="stats-grid" id="stats-grid"></div>
        </section>

        <section id="filter-section" class="panel hidden">
            <div class="panel-title">Filtros</div>
            <div class="filter-grid">
                <div class="form-group">
                    <label for="search-user">Buscar cliente</label>
                    <input type="text" id="search-user" placeholder="Nombre o ID..." onkeyup="filtrarUsuarios()">
                </div>

                <div class="form-group">
                    <label for="filter-sector">Sector</label>
                    <select id="filter-sector" onchange="filtrarUsuarios()">
                        <option value="">Todos los sectores</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="filter-valve">Válvula</label>
                    <select id="filter-valve" onchange="filtrarUsuarios()">
                        <option value="">Todas las válvulas</option>
                        <option value="A">Válvula A</option>
                        <option value="B">Válvula B</option>
                    </select>
                </div>
            </div>
        </section>

        <section id="export-section" class="panel hidden">
            <div class="panel-title">Exportación</div>
            <div class="export-actions">
                <button class="btn btn-blue" onclick="exportarCSV()">Exportar CSV</button>
                <button class="btn btn-blue" onclick="exportarTXT()">Exportar TXT</button>
                <button class="btn btn-blue" onclick="exportarJSON()">Exportar JSON</button>
                <button class="btn btn-amber" onclick="copiarTodasURLs()">Copiar todas</button>
            </div>
        </section>

        <section class="panel">
            <div class="panel-title">Clientes y enlaces</div>
            <div id="urls-container" class="urls-container">
                <div class="empty-state">
                    Genera las URLs para visualizar aquí los enlaces de acceso de cada cliente.
                </div>
            </div>
        </section>
    </div>

    <script src="usuarios-sectores-config.js"></script>
    <script>
        let urlsGeneradas = {};
        let urlsFiltradas = {};

        function normalizarBaseURL(baseURL) {
            const clean = baseURL.trim();
            if (!clean) return '';
            return clean;
        }

        function generarURLs() {
            const baseURL = normalizarBaseURL(document.getElementById('base-url').value);

            if (!baseURL) {
                alert('Por favor, introduce la URL base de la app.');
                return;
            }

            urlsGeneradas = generarURLsAccesoSectores(baseURL);
            urlsFiltradas = { ...urlsGeneradas };

            mostrarEstadisticas();
            configurarFiltros();
            mostrarURLs();

            document.getElementById('stats-section').classList.remove('hidden');
            document.getElementById('filter-section').classList.remove('hidden');
            document.getElementById('export-section').classList.remove('hidden');
        }

        function mostrarEstadisticas() {
            const usuarios = Object.entries(USUARIOS_SECTORES_CONFIG).filter(([id]) => id !== 'admin');
            const totalClientes = usuarios.length;
            const totalAccesos = usuarios.reduce((sum, [, cfg]) => sum + ((cfg.accesos || []).length), 0);

            const sectores = new Set();
            let valvulasA = 0;
            let valvulasB = 0;

            usuarios.forEach(([, cfg]) => {
                (cfg.accesos || []).forEach(acc => {
                    sectores.add(acc.sector);
                    if (acc.valve === 'A') valvulasA++;
                    if (acc.valve === 'B') valvulasB++;
                });
            });

            document.getElementById('stats-grid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Clientes</div>
                    <div class="stat-value">${totalClientes}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">URLs generadas</div>
                    <div class="stat-value">${Object.keys(urlsGeneradas).filter(id => id !== 'admin').length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Accesos totales</div>
                    <div class="stat-value">${totalAccesos}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Sectores únicos</div>
                    <div class="stat-value">${sectores.size}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">A / B</div>
                    <div class="stat-value">${valvulasA} / ${valvulasB}</div>
                </div>
            `;
        }

        function configurarFiltros() {
            const selectSector = document.getElementById('filter-sector');
            const sectoresUnicos = new Set();

            Object.entries(USUARIOS_SECTORES_CONFIG).forEach(([id, cfg]) => {
                if (id === 'admin') return;
                (cfg.accesos || []).forEach(acc => sectoresUnicos.add(Number(acc.sector)));
            });

            const sectoresOrdenados = [...sectoresUnicos].sort((a, b) => a - b);
            selectSector.innerHTML = '<option value="">Todos los sectores</option>';

            sectoresOrdenados.forEach(sector => {
                const option = document.createElement('option');
                option.value = sector;
                option.textContent = getSectorLabel(sector);
                selectSector.appendChild(option);
            });
        }

        function usuarioCoincideFiltro(usuario, searchTerm, sectorFilter, valveFilter) {
            const nombreMatch =
                usuario.usuario.toLowerCase().includes(searchTerm) ||
                usuario.id.toLowerCase().includes(searchTerm);

            const accesos = usuario.accesos || [];

            const sectorMatch = !sectorFilter || accesos.some(acc => String(acc.sector) === String(sectorFilter));
            const valveMatch = !valveFilter || accesos.some(acc => acc.valve === valveFilter);

            return nombreMatch && sectorMatch && valveMatch;
        }

        function filtrarUsuarios() {
            const searchTerm = document.getElementById('search-user').value.toLowerCase().trim();
            const sectorFilter = document.getElementById('filter-sector').value;
            const valveFilter = document.getElementById('filter-valve').value;

            urlsFiltradas = {};

            for (const [userId, urlData] of Object.entries(urlsGeneradas)) {
                const registro = {
                    id: userId,
                    usuario: urlData.usuario,
                    accesos: urlData.accesos || []
                };

                if (userId === 'admin') continue;
                if (usuarioCoincideFiltro(registro, searchTerm, sectorFilter, valveFilter)) {
                    urlsFiltradas[userId] = urlData;
                }
            }

            mostrarURLs();
        }

        function mostrarURLs() {
            const container = document.getElementById('urls-container');
            const items = Object.entries(urlsFiltradas).filter(([id]) => id !== 'admin');

            if (!items.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        No se encontraron clientes que coincidan con los filtros seleccionados.
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(([userId, urlData]) => {
                const accesosHtml = (urlData.accesos || []).map(acc => `
                    <div class="access-row">
                        <div><strong>${getSectorLabel(Number(acc.sector))}</strong> · Válvula ${acc.valve}</div>
                        <div>Parcela ${acc.parcela || '-'} · Contador ${acc.contador || '-'}</div>
                    </div>
                `).join('');

                return `
                    <div class="url-card">
                        <div class="url-card-header">
                            <div>
                                <div class="user-title">${urlData.usuario}</div>
                                <div class="user-meta">
                                    <span class="pill pill-blue">ID ${userId}</span>
                                    <span class="pill pill-green">${urlData.totalAccesos || 0} acceso(s)</span>
                                </div>
                            </div>
                        </div>

                        <div class="url-display" id="url-${userId}">${urlData.url}</div>

                        <div class="url-actions">
                            <button class="btn btn-small" onclick="copiarURL('${userId}')">Copiar</button>
                            <button class="btn btn-small btn-blue" onclick="abrirURL('${urlData.url}')">Abrir</button>
                            <button class="btn btn-small btn-amber" onclick="enviarPorEmail('${escapeJs(urlData.usuario)}','${escapeJs(urlData.url)}')">Email</button>
                        </div>

                        <div class="accesses-grid">
                            ${accesosHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function copiarURL(userId) {
            const url = document.getElementById(`url-${userId}`).textContent.trim();

            navigator.clipboard.writeText(url)
                .then(() => alert('URL copiada al portapapeles'))
                .catch(() => alert(url));
        }

        function abrirURL(url) {
            window.open(url, '_blank');
        }

        function enviarPorEmail(usuario, url) {
            const subject = encodeURIComponent(`Acceso a tu app de riego - ${usuario}`);
            const body = encodeURIComponent(
                `Hola ${usuario},\n\n` +
                `Tu enlace personal de acceso al sistema de riego es:\n\n${url}\n\n` +
                `Desde esta app podrás ver tus sectores, válvulas, consumos y estado del riego.\n\n` +
                `Importante: no compartas este enlace con otras personas.\n\n` +
                `Saludos.`
            );

            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function copiarTodasURLs() {
            const items = Object.entries(urlsFiltradas).filter(([id]) => id !== 'admin');

            if (!items.length) {
                alert('No hay URLs filtradas para copiar.');
                return;
            }

            let texto = 'MEMAC - URLS DE ACCESO\n';
            texto += '='.repeat(50) + '\n\n';

            items.forEach(([userId, data]) => {
                texto += `Cliente: ${data.usuario}\n`;
                texto += `ID: ${userId}\n`;
                texto += `URL: ${data.url}\n`;
                texto += `Accesos:\n`;

                (data.accesos || []).forEach(acc => {
                    texto += ` - ${getSectorLabel(Number(acc.sector))} · Válvula ${acc.valve} · Parcela ${acc.parcela || '-'} · Contador ${acc.contador || '-'}\n`;
                });

                texto += '\n' + '-'.repeat(50) + '\n\n';
            });

            navigator.clipboard.writeText(texto)
                .then(() => alert(`${items.length} URL(s) copiadas al portapapeles`))
                .catch(() => alert('No se pudieron copiar las URLs.'));
        }

        function exportarCSV() {
            const items = Object.entries(urlsFiltradas).filter(([id]) => id !== 'admin');
            let csv = 'ID,Nombre,URL,TotalAccesos,Sector,Valve,Parcela,Contador\n';

            items.forEach(([userId, data]) => {
                (data.accesos || []).forEach(acc => {
                    csv += `"${userId}","${data.usuario}","${data.url}","${data.totalAccesos || 0}","${acc.sector}","${acc.valve}","${acc.parcela || ''}","${acc.contador || ''}"\n`;
                });
            });

            descargarArchivo(csv, 'memac-urls-clientes.csv', 'text/csv');
        }

        function exportarTXT() {
            const items = Object.entries(urlsFiltradas).filter(([id]) => id !== 'admin');
            let txt = 'MEMAC - URLS DE ACCESO\n';
            txt += '='.repeat(50) + '\n\n';

            items.forEach(([userId, data]) => {
                txt += `Cliente: ${data.usuario}\n`;
                txt += `ID: ${userId}\n`;
                txt += `URL: ${data.url}\n`;
                txt += `Accesos:\n`;

                (data.accesos || []).forEach(acc => {
                    txt += ` * ${getSectorLabel(Number(acc.sector))} · Válvula ${acc.valve} · Parcela ${acc.parcela || '-'} · Contador ${acc.contador || '-'}\n`;
                });

                txt += '\n';
            });

            descargarArchivo(txt, 'memac-urls-clientes.txt', 'text/plain');
        }

        function exportarJSON() {
            const items = Object.fromEntries(
                Object.entries(urlsFiltradas).filter(([id]) => id !== 'admin')
            );

            descargarArchivo(
                JSON.stringify(items, null, 2),
                'memac-urls-clientes.json',
                'application/json'
            );
        }

        function descargarArchivo(contenido, nombreArchivo, tipoMIME) {
            const blob = new Blob([contenido], { type: tipoMIME });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = nombreArchivo;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }

        function limpiarResultados() {
            urlsGeneradas = {};
            urlsFiltradas = {};
            document.getElementById('stats-section').classList.add('hidden');
            document.getElementById('filter-section').classList.add('hidden');
            document.getElementById('export-section').classList.add('hidden');
            document.getElementById('search-user').value = '';
            document.getElementById('filter-sector').innerHTML = '<option value="">Todos los sectores</option>';
            document.getElementById('filter-valve').value = '';
            document.getElementById('urls-container').innerHTML = `
                <div class="empty-state">
                    Genera las URLs para visualizar aquí los enlaces de acceso de cada cliente.
                </div>
            `;
        }

        function escapeJs(value) {
            return String(value)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '&quot;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const pathBase = `${window.location.origin}${window.location.pathname.replace('generador-urls-3.html', 'index-4.html')}`;
            document.getElementById('base-url').value = pathBase;
        });
    </script>
</body>
</html>
