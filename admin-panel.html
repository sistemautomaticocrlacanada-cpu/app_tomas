<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMAC · Panel Administrador</title>
    <meta name="theme-color" content="#020617">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #020617;
            --bg-soft: #0f172a;
            --panel: rgba(15,23,42,0.96);
            --panel-2: rgba(30,41,59,0.72);
            --line: rgba(51,65,85,0.95);
            --text: #e5e7eb;
            --muted: #94a3b8;
            --blue: #3b82f6;
            --cyan: #22d3ee;
            --green: #22c55e;
            --amber: #f59e0b;
            --red: #ef4444;
            --shadow: 0 24px 60px rgba(0,0,0,0.4);
            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #0b1220 0%, #020617 45%, #000000 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(17,24,39,0.98));
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(245,158,11,0.16);
            border: 1px solid rgba(245,158,11,0.35);
            color: #fde68a;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .header h1 {
            font-size: 1.6rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #c7d2fe;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1 1 220px;
            padding: 14px 16px;
            border-radius: 16px;
            cursor: pointer;
            user-select: none;
            font-weight: 700;
            text-align: center;
            background: rgba(15,23,42,0.78);
            border: 1px solid var(--line);
            color: var(--muted);
            transition: 0.2s ease;
        }

        .tab:hover {
            border-color: rgba(59,130,246,0.55);
            color: var(--text);
        }

        .tab.active {
            color: #dbeafe;
            background: linear-gradient(135deg, rgba(59,130,246,0.22), rgba(37,99,235,0.18));
            border-color: rgba(59,130,246,0.45);
        }

        .panel {
            background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(17,24,39,0.98));
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .panel-title {
            color: var(--muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 14px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .btn {
            border: 1px solid rgba(51,65,85,0.9);
            background: linear-gradient(180deg, rgba(30,41,59,0.95), rgba(15,23,42,0.98));
            color: var(--text);
            border-radius: 14px;
            padding: 11px 14px;
            cursor: pointer;
            font-size: 0.92rem;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-blue {
            border-color: rgba(59,130,246,0.45);
            background: linear-gradient(135deg, rgba(59,130,246,0.22), rgba(37,99,235,0.18));
        }

        .btn-green {
            border-color: rgba(34,197,94,0.45);
            background: linear-gradient(135deg, rgba(34,197,94,0.22), rgba(21,128,61,0.18));
        }

        .btn-amber {
            border-color: rgba(245,158,11,0.45);
            background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(120,53,15,0.18));
        }

        .btn-red {
            border-color: rgba(239,68,68,0.45);
            background: linear-gradient(135deg, rgba(239,68,68,0.22), rgba(127,29,29,0.18));
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .users-grid,
        .tomas-grid,
        .stats-grid {
            display: grid;
            gap: 14px;
        }

        .users-grid {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        .tomas-grid {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .stats-grid {
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        }

        .user-card,
        .toma-card,
        .stat-card,
        .summary-card {
            background: rgba(15,23,42,0.82);
            border: 1px solid rgba(51,65,85,0.8);
            border-radius: 18px;
            padding: 16px;
        }

        .user-header,
        .toma-title {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .user-name,
        .toma-title strong {
            color: #93c5fd;
            font-size: 1rem;
            font-weight: 800;
        }

        .user-id,
        .pill {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .user-id {
            background: rgba(59,130,246,0.15);
            border: 1px solid rgba(59,130,246,0.35);
            color: #dbeafe;
        }

        .pill-green {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.35);
            color: #dcfce7;
        }

        .pill-red {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.35);
            color: #fecaca;
        }

        .pill-amber {
            background: rgba(245,158,11,0.15);
            border: 1px solid rgba(245,158,11,0.35);
            color: #fde68a;
        }

        .detail-row,
        .valve-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 0;
            border-bottom: 1px solid rgba(51,65,85,0.45);
            font-size: 0.9rem;
        }

        .detail-row:last-child,
        .valve-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: var(--muted);
        }

        .token-preview {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color: #93c5fd;
            font-size: 0.82rem;
        }

        .user-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .btn-small {
            padding: 8px 10px;
            font-size: 0.82rem;
            border-radius: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 12px rgba(239,68,68,0.5);
        }

        .status-dot.active {
            background: var(--green);
            box-shadow: 0 0 12px rgba(34,197,94,0.55);
        }

        .valve-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .valve-data {
            color: var(--muted);
            font-size: 0.88rem;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: #93c5fd;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.88rem;
        }

        .summary-card h3 {
            margin-bottom: 12px;
            color: #c7d2fe;
            font-size: 1rem;
        }

        .summary-card ul {
            list-style: none;
            display: grid;
            gap: 8px;
        }

        .summary-card li {
            padding: 10px 12px;
            background: rgba(30,41,59,0.5);
            border: 1px solid rgba(51,65,85,0.55);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.9rem;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 560px;
            background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(17,24,39,0.98));
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 22px;
            box-shadow: var(--shadow);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #c7d2fe;
        }

        .close-btn {
            border: none;
            background: rgba(239,68,68,0.12);
            color: #fecaca;
            border-radius: 12px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 1rem;
        }

        .form-grid {
            display: grid;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        input, select {
            width: 100%;
            background: rgba(15,23,42,0.95);
            color: var(--text);
            border: 1px solid rgba(51,65,85,0.95);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: rgba(59,130,246,0.95);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 760px) {
            body {
                padding: 10px;
            }

            .header,
            .panel {
                padding: 14px;
            }

            .tabs {
                flex-direction: column;
            }

            .toolbar,
            .user-actions,
            .modal-actions {
                flex-direction: column;
            }

            .btn,
            .btn-small {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app" style="display:none;">
        <header class="header">
            <div class="admin-badge">👑 PANEL DE ADMINISTRACIÓN</div>
            <h1>MEMAC · Gestión de usuarios y tomas</h1>
            <p>Control del sistema de sectores, usuarios, asignaciones y supervisión general.</p>
        </header>

        <nav class="tabs">
            <div class="tab active" data-tab="usuarios">👥 Gestión de usuarios</div>
            <div class="tab" data-tab="tomas">🚿 Vista de tomas</div>
            <div class="tab" data-tab="estadisticas">📊 Estadísticas</div>
        </nav>

        <section id="usuarios-tab" class="tab-content active">
            <div class="panel">
                <div class="panel-title">Acciones de usuarios</div>
                <div class="toolbar">
                    <button class="btn btn-green" onclick="showAddUserModal()">➕ Añadir usuario</button>
                    <button class="btn btn-blue" onclick="generateAllURLs()">🔗 Generar todas las URLs</button>
                    <button class="btn btn-amber" onclick="exportUsers()">📤 Exportar usuarios</button>
                </div>
                <div id="users-grid" class="users-grid"></div>
            </div>
        </section>

        <section id="tomas-tab" class="tab-content">
            <div class="panel">
                <div class="panel-title">Supervisión de tomas</div>
                <div class="toolbar">
                    <button class="btn btn-blue" onclick="refreshTomas()">🔄 Actualizar tomas</button>
                    <button class="btn btn-red" onclick="resetAllDaily()">🧯 Reset todos diarios</button>
                </div>
                <div id="tomas-grid" class="tomas-grid"></div>
            </div>
        </section>

        <section id="estadisticas-tab" class="tab-content">
            <div class="panel">
                <div class="panel-title">Indicadores</div>
                <div id="stats-grid" class="stats-grid"></div>
            </div>

            <div class="panel summary-card">
                <h3>Resumen del sistema</h3>
                <div id="system-summary"></div>
            </div>
        </section>
    </div>

    <div id="user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Añadir usuario</div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <form id="user-form" class="form-grid">
                <div class="form-group">
                    <label for="user-id">ID usuario</label>
                    <input type="text" id="user-id" placeholder="001, 002, 051..." required>
                </div>

                <div class="form-group">
                    <label for="user-name">Nombre completo</label>
                    <input type="text" id="user-name" placeholder="Nombre del cliente" required>
                </div>

                <div class="form-group">
                    <label for="user-sector">Sector</label>
                    <select id="user-sector" required></select>
                </div>

                <div class="form-group">
                    <label for="user-valve">Válvula</label>
                    <select id="user-valve" required>
                        <option value="">Seleccionar válvula...</option>
                        <option value="A">Válvula A</option>
                        <option value="B">Válvula B</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="user-token">Token</label>
                    <input type="text" id="user-token" readonly>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-green">Guardar usuario</button>
                </div>
            </form>
        </div>
    </div>

    <script src="usuarios-sectores-config.js"></script>
    <script>
        const ADMIN_USER = 'admin';
        const ADMIN_TOKEN = 'admin_master_2024_secure';

        let currentUsers = {};
        let editingUserId = null;
        let tomasData = {};

        function getAdminURLParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                user: params.get('user'),
                token: params.get('token')
            };
        }

        function credencialesAdminValidas() {
            const { user, token } = getAdminURLParams();
            return user === ADMIN_USER && token === ADMIN_TOKEN;
        }

        function mostrarErrorAccesoAdmin() {
            document.body.innerHTML = `
                <div style="
                    min-height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 20px;
                    background: radial-gradient(circle at top, #0b1220 0%, #020617 45%, #000 100%);
                    color: #e5e7eb;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                ">
                    <div style="
                        width: 100%;
                        max-width: 520px;
                        background: rgba(15,23,42,0.96);
                        border: 1px solid rgba(239,68,68,0.4);
                        border-radius: 22px;
                        padding: 28px 22px;
                        box-shadow: 0 24px 60px rgba(0,0,0,0.45);
                        text-align: center;
                    ">
                        <div style="
                            display: inline-block;
                            padding: 8px 14px;
                            border-radius: 999px;
                            background: rgba(239,68,68,0.14);
                            border: 1px solid rgba(239,68,68,0.35);
                            color: #fecaca;
                            font-size: 0.82rem;
                            font-weight: 700;
                            margin-bottom: 16px;
                        ">
                            Acceso denegado
                        </div>

                        <h1 style="
                            font-size: 1.35rem;
                            color: #c7d2fe;
                            margin-bottom: 10px;
                            letter-spacing: 0.08em;
                            text-transform: uppercase;
                        ">
                            Panel administrador protegido
                        </h1>

                        <p style="
                            color: #94a3b8;
                            line-height: 1.6;
                            margin-bottom: 20px;
                            font-size: 0.95rem;
                        ">
                            Debes acceder mediante credenciales válidas de administrador.
                        </p>

                        <a href="admin.html" style="
                            display: inline-block;
                            text-decoration: none;
                            color: #e5e7eb;
                            background: linear-gradient(135deg, rgba(59,130,246,0.22), rgba(37,99,235,0.18));
                            border: 1px solid rgba(59,130,246,0.45);
                            border-radius: 14px;
                            padding: 12px 16px;
                            font-weight: 600;
                        ">
                            Ir a admin.html
                        </a>
                    </div>
                </div>
            `;
        }

        function validarAccesoAdminPanel() {
            if (!credencialesAdminValidas()) {
                mostrarErrorAccesoAdmin();
                return false;
            }
            return true;
        }

        function buildSectorOptions() {
            const select = document.getElementById('user-sector');
            const sectores = new Set();

            Object.values(USUARIOS_SECTORES_CONFIG).forEach(user => {
                if (!user.isAdmin && typeof user.sector === 'number') {
                    sectores.add(user.sector);
                }
            });

            const sectoresOrdenados = [...sectores].sort((a, b) => a - b);

            select.innerHTML = '<option value="">Seleccionar sector...</option>';
            sectoresOrdenados.forEach(sector => {
                const option = document.createElement('option');
                option.value = sector;
                option.textContent = getSectorLabel(sector);
                select.appendChild(option);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.tab === tabName);
            });

            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.toggle('active', content.id === `${tabName}-tab`);
            });

            if (tabName === 'tomas') loadTomas();
            if (tabName === 'estadisticas') loadStats();
        }

        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });
        }

        function renderUsers() {
            const grid = document.getElementById('users-grid');
            const entries = Object.entries(currentUsers).filter(([id]) => id !== 'admin');

            if (!entries.length) {
                grid.innerHTML = `<div class="user-card">No hay usuarios configurados.</div>`;
                return;
            }

            grid.innerHTML = entries.map(([userId, user]) => `
                <div class="user-card">
                    <div class="user-header">
                        <div>
                            <div class="user-name">${escapeHtml(user.name)}</div>
                        </div>
                        <div class="user-id">ID ${userId}</div>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Sector</span>
                        <span>${getSectorLabel(user.sector)}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Válvula</span>
                        <span class="pill ${user.valve === 'A' ? 'pill-green' : 'pill-amber'}">${user.valve}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Token</span>
                        <span class="token-preview">${escapeHtml(user.token)}</span>
                    </div>

                    <div class="user-actions">
                        <button class="btn btn-small btn-blue" onclick="editUser('${userId}')">Editar</button>
                        <button class="btn btn-small btn-green" onclick="viewUserToma('${userId}')">Ver toma</button>
                        <button class="btn btn-small btn-amber" onclick="copyUserURL('${userId}')">URL</button>
                        <button class="btn btn-small btn-red" onclick="deleteUser('${userId}')">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function showAddUserModal() {
            editingUserId = null;
            document.getElementById('modal-title').textContent = 'Añadir usuario';
            document.getElementById('user-form').reset();
            document.getElementById('user-id').disabled = false;
            document.getElementById('user-token').value = '';
            document.getElementById('user-modal').classList.add('show');
        }

        function editUser(userId) {
            const user = currentUsers[userId];
            if (!user) return;

            editingUserId = userId;
            document.getElementById('modal-title').textContent = 'Editar usuario';
            document.getElementById('user-id').value = userId;
            document.getElementById('user-id').disabled = true;
            document.getElementById('user-name').value = user.name || '';
            document.getElementById('user-sector').value = user.sector || '';
            document.getElementById('user-valve').value = user.valve || '';
            document.getElementById('user-token').value = user.token || '';
            document.getElementById('user-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('user-modal').classList.remove('show');
        }

        function generateToken() {
            const sector = document.getElementById('user-sector').value;
            const valve = document.getElementById('user-valve').value;

            if (sector && valve) {
                const randomStr = Math.random().toString(36).substring(2, 8);
                document.getElementById('user-token').value = `s${sector}${valve.toLowerCase()}_${randomStr}_2026`;
            }
        }

        function deleteUser(userId) {
            const user = currentUsers[userId];
            if (!user) return;

            if (!confirm(`¿Eliminar usuario ${user.name}?`)) return;

            delete currentUsers[userId];
            renderUsers();
            loadStats();
            saveUsersConfig();
        }

        function copyUserURL(userId) {
            const user = currentUsers[userId];
            if (!user) return;

            const basePath = `${window.location.origin}${window.location.pathname.replace('admin-panel-2.html', 'index-4.html')}`;
            const url = `${basePath}?user=${encodeURIComponent(userId)}&token=${encodeURIComponent(user.token)}`;

            navigator.clipboard.writeText(url)
                .then(() => alert('URL copiada al portapapeles'))
                .catch(() => alert(url));
        }

        function viewUserToma(userId) {
            const user = currentUsers[userId];
            if (!user) return;

            const basePath = `${window.location.origin}${window.location.pathname.replace('admin-panel-2.html', 'index-4.html')}`;
            const url = `${basePath}?user=${encodeURIComponent(userId)}&token=${encodeURIComponent(user.token)}`;
            window.open(url, '_blank');
        }

        function loadTomas() {
            tomasData = {};
            const sectors = [...new Set(
                Object.values(currentUsers)
                    .filter(u => !u.isAdmin && typeof u.sector === 'number')
                    .map(u => u.sector)
            )].sort((a, b) => a - b);

            sectors.forEach(sector => {
                tomasData[sector] = {
                    A: {
                        flow: Math.random() * 12,
                        total: Math.random() * 1200,
                        daily: Math.random() * 60,
                        status: Math.random() > 0.5,
                        mode: Math.floor(Math.random() * 3),
                        user: getUserBySectorValve(sector, 'A')
                    },
                    B: {
                        flow: Math.random() * 12,
                        total: Math.random() * 1200,
                        daily: Math.random() * 60,
                        status: Math.random() > 0.5,
                        mode: Math.floor(Math.random() * 3),
                        user: getUserBySectorValve(sector, 'B')
                    }
                };
            });

            renderTomas();
        }

        function getUserBySectorValve(sector, valve) {
            const found = Object.entries(currentUsers).find(([id, u]) =>
                id !== 'admin' && u.sector === sector && u.valve === valve
            );
            return found ? found[1].name : 'Sin asignar';
        }

        function getModeText(mode) {
            switch (mode) {
                case 0: return 'OFF';
                case 1: return 'MANUAL';
                case 2: return 'AUTO';
                default: return '---';
            }
        }

        function renderTomas() {
            const grid = document.getElementById('tomas-grid');
            const entries = Object.entries(tomasData);

            if (!entries.length) {
                grid.innerHTML = `<div class="toma-card">No hay tomas disponibles.</div>`;
                return;
            }

            grid.innerHTML = entries.map(([sector, data]) => `
                <div class="toma-card">
                    <div class="toma-title">
                        <strong>${getSectorLabel(Number(sector))}</strong>
                        <button class="btn btn-small btn-blue" onclick="manageSector(${Number(sector)})">Gestionar</button>
                    </div>

                    <div class="valve-row">
                        <div class="valve-info">
                            <div class="status-dot ${data.A.status ? 'active' : ''}"></div>
                            <span>Válvula A</span>
                        </div>
                        <div class="valve-data">
                            ${(data.A.flow / 3.6).toFixed(2)} l/s · ${data.A.total.toFixed(1)} m³ · ${getModeText(data.A.mode)}
                        </div>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Usuario A</span>
                        <span>${escapeHtml(data.A.user)}</span>
                    </div>

                    <div class="valve-row">
                        <div class="valve-info">
                            <div class="status-dot ${data.B.status ? 'active' : ''}"></div>
                            <span>Válvula B</span>
                        </div>
                        <div class="valve-data">
                            ${(data.B.flow / 3.6).toFixed(2)} l/s · ${data.B.total.toFixed(1)} m³ · ${getModeText(data.B.mode)}
                        </div>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Usuario B</span>
                        <span>${escapeHtml(data.B.user)}</span>
                    </div>
                </div>
            `).join('');
        }

        function refreshTomas() {
            loadTomas();
        }

        function resetAllDaily() {
            if (!confirm('¿Seguro que quieres resetear todos los contadores diarios?')) return;
            alert('Acción preparada. En la siguiente fase se conectará a Node-RED.');
        }

        function manageSector(sector) {
            alert(
                `Sector ${getSectorLabel(sector)}\n\n` +
                `Aquí podrás:\n` +
                `- Resetear contadores\n` +
                `- Cambiar modo\n` +
                `- Ver histórico\n` +
                `- Reasignar usuarios`
            );
        }

        function loadStats() {
            const users = Object.entries(currentUsers).filter(([id]) => id !== 'admin');
            const totalUsers = users.length;
            const sectorsWithUsers = new Set(users.map(([, u]) => u.sector)).size;
            const valvesA = users.filter(([, u]) => u.valve === 'A').length;
            const valvesB = users.filter(([, u]) => u.valve === 'B').length;

            document.getElementById('stats-grid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalUsers}</div>
                    <div class="stat-label">Usuarios totales</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${sectorsWithUsers}</div>
                    <div class="stat-label">Sectores con usuarios</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${valvesA}</div>
                    <div class="stat-label">Válvulas A</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${valvesB}</div>
                    <div class="stat-label">Válvulas B</div>
                </div>
            `;

            const sectorGroups = {};
            users.forEach(([, user]) => {
                const sectorLabel = getSectorLabel(user.sector);
                if (!sectorGroups[sectorLabel]) sectorGroups[sectorLabel] = [];
                sectorGroups[sectorLabel].push(`${user.name} (${user.valve})`);
            });

            const summaryHtml = Object.keys(sectorGroups).length
                ? `<ul>${Object.entries(sectorGroups).map(([sector, list]) => `
                    <li><strong>${escapeHtml(sector)}:</strong> ${escapeHtml(list.join(', '))}</li>
                `).join('')}</ul>`
                : '<p>No hay usuarios asignados.</p>';

            document.getElementById('system-summary').innerHTML = summaryHtml;
        }

        function saveUsersConfig() {
            console.log('Configuración actualizada:', currentUsers);
        }

        function generateAllURLs() {
            const adminQuery = `?user=${encodeURIComponent(ADMIN_USER)}&token=${encodeURIComponent(ADMIN_TOKEN)}`;
            const target = `generador-urls-3.html${adminQuery}`;
            window.open(target, '_blank');
        }

        function exportUsers() {
            const data = JSON.stringify(currentUsers, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'usuarios-config.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.getElementById('user-sector').addEventListener('change', generateToken);
        document.getElementById('user-valve').addEventListener('change', generateToken);

        document.getElementById('user-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const userId = document.getElementById('user-id').value.trim();
            const name = document.getElementById('user-name').value.trim();
            const sector = parseInt(document.getElementById('user-sector').value, 10);
            const valve = document.getElementById('user-valve').value;
            const token = document.getElementById('user-token').value.trim();

            if (!userId || !name || !sector || !valve || !token) {
                alert('Completa todos los campos.');
                return;
            }

            const existing = Object.entries(currentUsers).find(([id, user]) =>
                id !== 'admin' &&
                id !== editingUserId &&
                user.sector === sector &&
                user.valve === valve
            );

            if (existing) {
                alert(`Ya existe un usuario asignado a ${getSectorLabel(sector)} válvula ${valve}.`);
                return;
            }

            currentUsers[editingUserId || userId] = {
                sector,
                valve,
                name,
                token
            };

            if (editingUserId && editingUserId !== userId) {
                delete currentUsers[editingUserId];
            }

            renderUsers();
            loadStats();
            closeModal();
            saveUsersConfig();
        });

        document.getElementById('user-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (!validarAccesoAdminPanel()) return;

            currentUsers = JSON.parse(JSON.stringify(USUARIOS_SECTORES_CONFIG || {}));
            buildSectorOptions();
            setupTabs();
            renderUsers();
            loadStats();
            document.getElementById('app').style.display = 'block';
        });
    </script>
</body>
</html>
