<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Gestión de Usuarios y Tomas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
        }
        .admin-badge {
            background: linear-gradient(45deg, #FF6B35, #F7931E);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 30px;
            gap: 5px;
        }
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .tab.active {
            background: linear-gradient(45deg, #007AFF, #5856D6);
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Gestión de Usuarios */
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .user-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .user-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.2);
        }
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .user-name {
            font-weight: 700;
            font-size: 1.1em;
            color: #00D4FF;
        }
        .user-id {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.8em;
        }
        .user-details {
            margin-bottom: 15px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .user-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-edit { background: #007AFF; color: white; }
        .btn-delete { background: #FF3B30; color: white; }
        .btn-view { background: #34C759; color: white; }
        .btn-url { background: #FF9500; color: white; }
        .btn:hover { transform: translateY(-1px); }
        
        /* Vista de Tomas */
        .tomas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .toma-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 15px;
        }
        .toma-title {
            font-weight: 700;
            color: #00D4FF;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .valve-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        .valve-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #FF3B30;
        }
        .status-dot.active { background: #32D74B; }
        .valve-data { font-size: 0.85em; color: #ccc; }
        
        /* Modales */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #1e3c72;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title {
            font-size: 1.3em;
            font-weight: 700;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5em;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
        }
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn-primary {
            background: #007AFF;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        /* Estadísticas */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: 800;
            color: #00D4FF;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .tabs { flex-direction: column; }
            .users-grid, .tomas-grid { grid-template-columns: 1fr; }
            .user-actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="admin-badge">👑 PANEL DE ADMINISTRACIÓN</div>
            <h1>Gestión de Usuarios y Tomas</h1>
            <p>Control total del sistema de sectores</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('usuarios')">👥 Gestión de Usuarios</div>
            <div class="tab" onclick="switchTab('tomas')">🚿 Vista de Tomas</div>
            <div class="tab" onclick="switchTab('estadisticas')">📊 Estadísticas</div>
        </div>

        <!-- Tab Gestión de Usuarios -->
        <div id="usuarios-tab" class="tab-content active">
            <div style="margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="showAddUserModal()">➕ Añadir Usuario</button>
                <button class="btn btn-view" onclick="generateAllURLs()">🔗 Generar Todas las URLs</button>
                <button class="btn btn-url" onclick="exportUsers()">📤 Exportar Usuarios</button>
            </div>
            <div id="users-grid" class="users-grid"></div>
        </div>

        <!-- Tab Vista de Tomas -->
        <div id="tomas-tab" class="tab-content">
            <div style="margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="refreshTomas()">🔄 Actualizar Tomas</button>
                <button class="btn btn-view" onclick="resetAllDaily()">🔄 Reset Todos Diarios</button>
            </div>
            <div id="tomas-grid" class="tomas-grid"></div>
        </div>

        <!-- Tab Estadísticas -->
        <div id="estadisticas-tab" class="tab-content">
            <div id="stats-grid" class="stats-grid"></div>
            <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px;">
                <h3>📈 Resumen del Sistema</h3>
                <div id="system-summary"></div>
            </div>
        </div>
    </div>

    <!-- Modal Añadir/Editar Usuario -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Añadir Usuario</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="user-form">
                <div class="form-group">
                    <label>ID Usuario:</label>
                    <input type="text" id="user-id" placeholder="001, 002, etc." required>
                </div>
                <div class="form-group">
                    <label>Nombre Completo:</label>
                    <input type="text" id="user-name" placeholder="Juan Pérez González" required>
                </div>
                <div class="form-group">
                    <label>Sector:</label>
                    <select id="user-sector" required>
                        <option value="">Seleccionar sector...</option>
                        <option value="2">H1 002</option>
                        <option value="3">H1 003</option>
                        <option value="4">H1 004</option>
                        <option value="5">H1 005</option>
                        <option value="6">H1 006</option>
                        <option value="13">H2 013</option>
                        <option value="14">H2 014</option>
                        <option value="15">H2 015</option>
                        <option value="17">H2 017</option>
                        <option value="18">H2 018</option>
                        <option value="26">H3 026</option>
                        <option value="27">H3 027</option>
                        <option value="28">H3 028</option>
                        <option value="29">H3 029</option>
                        <option value="30">H3 030</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Válvula:</label>
                    <select id="user-valve" required>
                        <option value="">Seleccionar válvula...</option>
                        <option value="A">Válvula A</option>
                        <option value="B">Válvula B</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Token (se genera automáticamente):</label>
                    <input type="text" id="user-token" readonly>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>

    <script src="usuarios-sectores-config.js"></script>
    <script>
        let currentUsers = {...USUARIOS_SECTORES_CONFIG};
        let editingUserId = null;
        let tomasData = {};

        // Gestión de Tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
            
            if (tabName === 'tomas') loadTomas();
            if (tabName === 'estadisticas') loadStats();
        }

        // Gestión de Usuarios
        function renderUsers() {
            const grid = document.getElementById('users-grid');
            let html = '';

            for (const [userId, user] of Object.entries(currentUsers)) {
                if (userId === 'admin') continue; // No mostrar admin en la lista
                
                const sectorLabel = getSectorLabel(user.sector);
                html += `
                    <div class="user-card">
                        <div class="user-header">
                            <div class="user-name">${user.name}</div>
                            <div class="user-id">ID: ${userId}</div>
                        </div>
                        <div class="user-details">
                            <div class="detail-row">
                                <span>Sector:</span>
                                <span>${sectorLabel}</span>
                            </div>
                            <div class="detail-row">
                                <span>Válvula:</span>
                                <span>${user.valve}</span>
                            </div>
                            <div class="detail-row">
                                <span>Token:</span>
                                <span style="font-family: monospace; font-size: 0.8em;">${user.token.substring(0, 15)}...</span>
                            </div>
                        </div>
                        <div class="user-actions">
                            <button class="btn btn-edit" onclick="editUser('${userId}')">✏️ Editar</button>
                            <button class="btn btn-view" onclick="viewUserToma('${userId}')">👁️ Ver Toma</button>
                            <button class="btn btn-url" onclick="copyUserURL('${userId}')">🔗 URL</button>
                            <button class="btn btn-delete" onclick="deleteUser('${userId}')">🗑️ Eliminar</button>
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        function showAddUserModal() {
            editingUserId = null;
            document.getElementById('modal-title').textContent = 'Añadir Usuario';
            document.getElementById('user-form').reset();
            document.getElementById('user-modal').classList.add('show');
            generateToken(); // Generar token automáticamente
        }

        function editUser(userId) {
            editingUserId = userId;
            const user = currentUsers[userId];
            
            document.getElementById('modal-title').textContent = 'Editar Usuario';
            document.getElementById('user-id').value = userId;
            document.getElementById('user-name').value = user.name;
            document.getElementById('user-sector').value = user.sector;
            document.getElementById('user-valve').value = user.valve;
            document.getElementById('user-token').value = user.token;
            
            document.getElementById('user-modal').classList.add('show');
        }

        function deleteUser(userId) {
            if (confirm(`¿Eliminar usuario ${currentUsers[userId].name}?`)) {
                delete currentUsers[userId];
                renderUsers();
                saveUsersConfig();
            }
        }

        function generateToken() {
            const sector = document.getElementById('user-sector').value;
            const valve = document.getElementById('user-valve').value;
            
            if (sector && valve) {
                const randomStr = Math.random().toString(36).substring(2, 8);
                const token = `s${sector}${valve.toLowerCase()}_${randomStr}_2024`;
                document.getElementById('user-token').value = token;
            }
        }

        function closeModal() {
            document.getElementById('user-modal').classList.remove('show');
        }

        // Auto-generar token cuando cambian sector o válvula
        document.getElementById('user-sector').addEventListener('change', generateToken);
        document.getElementById('user-valve').addEventListener('change', generateToken);

        // Manejar formulario
        document.getElementById('user-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('user-id').value;
            const userData = {
                sector: parseInt(document.getElementById('user-sector').value),
                valve: document.getElementById('user-valve').value,
                name: document.getElementById('user-name').value,
                token: document.getElementById('user-token').value
            };

            // Validar que no exista otro usuario con el mismo sector/válvula
            const existing = Object.entries(currentUsers).find(([id, user]) => 
                id !== userId && user.sector === userData.sector && user.valve === userData.valve
            );

            if (existing) {
                alert(`Ya existe un usuario (${existing[1].name}) asignado a ${getSectorLabel(userData.sector)} Válvula ${userData.valve}`);
                return;
            }

            currentUsers[userId] = userData;
            renderUsers();
            saveUsersConfig();
            closeModal();
        });

        function copyUserURL(userId) {
            const user = currentUsers[userId];
            const baseURL = 'https://tu-usuario.github.io/app_tomas';
            const url = `${baseURL}/?user=${userId}&token=${user.token}`;
            
            navigator.clipboard.writeText(url).then(() => {
                alert('URL copiada al portapapeles');
            });
        }

        function viewUserToma(userId) {
            const user = currentUsers[userId];
            const sectorLabel = getSectorLabel(user.sector);
            alert(`Ver toma de ${user.name}:\n${sectorLabel} Válvula ${user.valve}\n\nEsta función abrirá la vista específica de la toma.`);
        }

        // Vista de Tomas
        function loadTomas() {
            // Simular datos de tomas
            const sectors = [2,3,4,5,6,13,14,15,17,18,26,27,28,29,30,39,40,41,42,43,49,50,51,52,53];
            tomasData = {};
            
            sectors.forEach(sector => {
                tomasData[sector] = {
                    A: {
                        flow: Math.random() * 10,
                        total: Math.random() * 1000,
                        daily: Math.random() * 50,
                        status: Math.random() > 0.5,
                        mode: Math.floor(Math.random() * 3),
                        user: getUserBySectorValve(sector, 'A')
                    },
                    B: {
                        flow: Math.random() * 10,
                        total: Math.random() * 1000,
                        daily: Math.random() * 50,
                        status: Math.random() > 0.5,
                        mode: Math.floor(Math.random() * 3),
                        user: getUserBySectorValve(sector, 'B')
                    }
                };
            });
            
            renderTomas();
        }

        function getUserBySectorValve(sector, valve) {
            const user = Object.entries(currentUsers).find(([id, u]) => 
                u.sector === sector && u.valve === valve
            );
            return user ? user[1].name : 'Sin asignar';
        }

        function renderTomas() {
            const grid = document.getElementById('tomas-grid');
            let html = '';

            for (const [sector, data] of Object.entries(tomasData)) {
                const sectorLabel = getSectorLabel(parseInt(sector));
                
                html += `
                    <div class="toma-card">
                        <div class="toma-title">
                            ${sectorLabel}
                            <button class="btn btn-edit" onclick="manageSector(${sector})">⚙️</button>
                        </div>
                        
                        <div class="valve-row">
                            <div class="valve-info">
                                <div class="status-dot ${data.A.status ? 'active' : ''}"></div>
                                <span>Válvula A</span>
                            </div>
                            <div class="valve-data">
                                ${(data.A.flow * 1000 / 3600).toFixed(1)} l/s | ${data.A.total.toFixed(1)} m³
                            </div>
                        </div>
                        <div style="font-size: 0.8em; color: #aaa; margin-left: 18px; margin-bottom: 8px;">
                            Usuario: ${data.A.user}
                        </div>
                        
                        <div class="valve-row">
                            <div class="valve-info">
                                <div class="status-dot ${data.B.status ? 'active' : ''}"></div>
                                <span>Válvula B</span>
                            </div>
                            <div class="valve-data">
                                ${(data.B.flow * 1000 / 3600).toFixed(1)} l/s | ${data.B.total.toFixed(1)} m³
                            </div>
                        </div>
                        <div style="font-size: 0.8em; color: #aaa; margin-left: 18px;">
                            Usuario: ${data.B.user}
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        function refreshTomas() {
            loadTomas();
        }

        function manageSector(sector) {
            alert(`Gestionar sector ${getSectorLabel(sector)}\n\nAquí podrías:\n- Resetear contadores\n- Cambiar modo\n- Ver histórico\n- Asignar/desasignar usuarios`);
        }

        // Estadísticas
        function loadStats() {
            const totalUsers = Object.keys(currentUsers).length - 1; // -1 para no contar admin
            const sectorsWithUsers = new Set(Object.values(currentUsers).filter(u => u.sector !== 'ALL').map(u => u.sector)).size;
            const valvesA = Object.values(currentUsers).filter(u => u.valve === 'A').length;
            const valvesB = Object.values(currentUsers).filter(u => u.valve === 'B').length;

            document.getElementById('stats-grid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalUsers}</div>
                    <div class="stat-label">Usuarios Totales</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${sectorsWithUsers}</div>
                    <div class="stat-label">Sectores con Usuarios</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${valvesA}</div>
                    <div class="stat-label">Válvulas A Asignadas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${valvesB}</div>
                    <div class="stat-label">Válvulas B Asignadas</div>
                </div>
            `;

            // Resumen detallado
            let summary = '<h4>Distribución por Sectores:</h4><ul>';
            const sectorGroups = {};
            
            Object.values(currentUsers).forEach(user => {
                if (user.sector !== 'ALL') {
                    const sectorLabel = getSectorLabel(user.sector);
                    if (!sectorGroups[sectorLabel]) sectorGroups[sectorLabel] = [];
                    sectorGroups[sectorLabel].push(`${user.name} (${user.valve})`);
                }
            });

            for (const [sector, users] of Object.entries(sectorGroups)) {
                summary += `<li><strong>${sector}:</strong> ${users.join(', ')}</li>`;
            }
            summary += '</ul>';

            document.getElementById('system-summary').innerHTML = summary;
        }

        function saveUsersConfig() {
            // Aquí guardarías la configuración actualizada
            console.log('Configuración actualizada:', currentUsers);
            // En una implementación real, enviarías esto al servidor
        }

        function generateAllURLs() {
            window.open('generador-urls.html', '_blank');
        }

        function exportUsers() {
            const data = JSON.stringify(currentUsers, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'usuarios-config.json';
            a.click();
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            renderUsers();
        });
    </script>
</body>
</html>
