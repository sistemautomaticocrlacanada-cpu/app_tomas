<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <title>MEMAC Irrigation Control APP</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .container {
            max-width: 100%;
            padding: 10px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-badge {
            background: linear-gradient(45deg, #007AFF, #5856D6);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }

        .status-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #32D74B;
            box-shadow: 0 0 10px #32D74B;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .status-light.offline {
            background: #FF3B30;
            box-shadow: 0 0 10px #FF3B30;
        }

        .sector-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .sector-title {
            font-size: 1.4em;
            font-weight: 700;
            color: #fff;
        }

        .valve-badge {
            background: linear-gradient(45deg, #34C759, #28A745);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .valve-section {
            margin-top: 20px;
        }

        .valve-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .valve-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .valve-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.1em;
        }

        .valve-status-light {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s ease;
        }

        .valve-status-light.running {
            background: #32D74B;
            box-shadow: 0 0 15px #32D74B, 0 0 30px rgba(50, 215, 75, 0.5);
            border-color: #32D74B;
        }

        .valve-status-light.stopped {
            background: #FF3B30;
            box-shadow: 0 0 15px #FF3B30, 0 0 30px rgba(255, 59, 48, 0.5);
            border-color: #FF3B30;
        }

        .flow-display {
            text-align: center;
            margin: 25px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }

        .flow-value {
            font-size: 3em;
            font-weight: 800;
            color: #00D4FF;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            line-height: 1;
        }

        .flow-unit {
            color: #a0a0a0;
            font-size: 0.4em;
            margin-left: 5px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .metric-item {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .metric-label {
            font-size: 0.8em;
            color: #c0c0c0;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 1.3em;
            font-weight: 700;
            color: #fff;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 12px;
            padding: 15px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
            font-weight: 500;
            text-align: center;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.95);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
        }

        .mode-badge {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .mode-auto { background: rgba(0, 128, 255, 0.3); color: #0080FF; }
        .mode-manual { background: rgba(52, 199, 89, 0.3); color: #34C759; }
        .mode-off { background: rgba(255, 59, 48, 0.3); color: #FF3B30; }

        .error-message {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 15px;
            color: #FF3B30;
            margin: 20px 0;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            font-size: 1.1em;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, #007AFF, #0056CC);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            touch-action: manipulation;
        }

        .refresh-btn:active {
            transform: scale(0.9);
        }

        .last-update {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.8em;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .connection-config {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .config-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .config-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Optimizaciones para móviles */
        @media (max-width: 480px) {
            .container {
                padding: 5px;
            }
            
            .flow-value {
                font-size: 2.5em;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            .user-info {
                flex-direction: column;
                text-align: center;
            }
            
            .card-header {
                flex-direction: column;
                text-align: center;
            }
        }

        /* PWA Styles */
        .install-prompt {
            background: rgba(52, 199, 89, 0.1);
            border: 1px solid rgba(52, 199, 89, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .install-btn {
            background: #34C759;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MEMAC Irrigation Control APP</h1>
            <p>Control y visualización del sistema de riego</p>
        </div>

        <!-- Prompt de instalación PWA -->
        <div id="install-prompt" class="install-prompt">
            <div>📱 Instala MEMAC en tu móvil</div>
            <button id="install-btn" class="install-btn">Instalar App</button>
        </div>

        <!-- Configuración de conexión -->
        <div class="connection-config">
            <label>🔗 Servidor MEMAC:</label>
            <input type="text" id="node-red-url" class="config-input" 
                   placeholder="http://tu-servidor.com:1880" 
                   value="http://localhost:1880">
        </div>

        <div id="user-info" class="user-info" style="display: none;">
            <div>
                <span class="user-badge" id="user-badge">Usuario: ---</span>
            </div>
            <div class="status-indicator">
                <div class="status-light" id="connection-status"></div>
                <span id="connection-text">Conectando...</span>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <div>Cargando datos de tu instalación...</div>
        </div>

        <div id="error" class="error-message" style="display: none;">
            <h3>❌ Error de Conexión</h3>
            <p id="error-message">No se pudo conectar con el servidor.</p>
            <button class="btn" onclick="reintentar()" style="margin-top: 15px; width: auto; display: inline-block;">
                🔄 Reintentar
            </button>
        </div>

        <div id="sector-container"></div>
    </div>

    <button class="refresh-btn" onclick="refreshData()" title="Actualizar datos">
        🔄
    </button>

    <script src="usuarios-sectores-config.js"></script>
    <script>
        // Variables globales
        let currentUser = null;
        let currentSector = null;
        let currentValve = null;
        let sectorData = null;
        let nodeRedUrl = 'http://localhost:1880';
        let updateInterval = null;

        // PWA Installation
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-prompt').style.display = 'block';
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('install-prompt').style.display = 'none';
            }
        });

        // Obtener parámetros de URL
        function getURLParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                user: params.get('user'),
                token: params.get('token')
            };
        }

        // Validar usuario
        function validateUser() {
            const { user, token } = getURLParams();
            
            if (!user || !token) {
                showError('URL inválida. Faltan parámetros de usuario o token.');
                return false;
            }

            // Verificar si es administrador
            if (user === 'admin' && token === 'admin_master_2024_secure') {
                // Redirigir a panel de administrador
                window.location.href = 'admin.html?user=admin&token=admin_master_2024_secure';
                return false;
            }

            const validation = validarAccesoSector(user, token);
            if (!validation.valido) {
                showError(validation.error);
                return false;
            }

            currentUser = {
                id: user,
                name: validation.usuario,
                sector: validation.sector,
                valve: validation.valve,
                sectorLabel: validation.sectorLabel,
                token: token
            };
            
            currentSector = validation.sector;
            currentValve = validation.valve;
            return true;
        }

        // Mostrar error
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent = message;
            updateConnectionStatus(false, 'Error');
        }

        // Mostrar información del usuario
        function showUserInfo() {
            const userInfo = document.getElementById('user-info');
            const userBadge = document.getElementById('user-badge');
            
            userBadge.textContent = `${currentUser.name} - ${currentUser.sectorLabel} ${currentUser.valve}`;
            userInfo.style.display = 'flex';
        }

        // Actualizar estado de conexión
        function updateConnectionStatus(connected, text = '') {
            const statusLight = document.getElementById('connection-status');
            const statusText = document.getElementById('connection-text');
            
            if (connected) {
                statusLight.classList.remove('offline');
                statusText.textContent = text || 'Conectado';
            } else {
                statusLight.classList.add('offline');
                statusText.textContent = text || 'Sin conexión';
            }
        }

        // Obtener datos del sector desde Node-RED
        async function obtenerDatosSector() {
            try {
                const url = `${nodeRedUrl}/api/sector/${currentSector}/${currentValve}`;
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentUser.token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error obteniendo datos:', error);
                // Usar datos simulados si falla la conexión
                return generarDatosSimulados();
            }
        }

        // Generar datos simulados (fallback)
        function generarDatosSimulados() {
            return {
                sector: currentSector,
                valve: currentValve,
                sectorLabel: currentUser.sectorLabel,
                data: {
                    flow: Math.random() * 10,
                    total: Math.random() * 1000,
                    daily: Math.random() * 50,
                    status: Math.random() > 0.5,
                    mode: Math.floor(Math.random() * 3)
                },
                lastUpdate: new Date().toLocaleString(),
                simulated: true
            };
        }

        // Formatear flujo
        function formatFlow(flow) {
            return (flow * 1000 / 3600).toFixed(2);
        }

        // Formatear contador
        function formatCounter(value) {
            return value.toFixed(1).padStart(8, '0');
        }

        // Obtener texto del modo
        function getModeText(mode) {
            switch(mode) {
                case 0: return 'OFF';
                case 1: return 'MANUAL';
                case 2: return 'AUTO';
                default: return '---';
            }
        }

        // Obtener clase CSS del modo
        function getModeClass(mode) {
            switch(mode) {
                case 0: return 'mode-off';
                case 1: return 'mode-manual';
                case 2: return 'mode-auto';
                default: return 'mode-off';
            }
        }

        // Renderizar sector
        function renderSector() {
            if (!sectorData) return;

            const container = document.getElementById('sector-container');
            const data = sectorData.data;
            
            const simulatedWarning = sectorData.simulated ? 
                '<div style="background: rgba(255, 149, 0, 0.2); padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 0.9em;">⚠️ Datos simulados - Verificar conexión Node-RED</div>' : '';
            
            const html = `
                <div class="sector-card">
                    ${simulatedWarning}
                    <div class="card-header">
                        <div class="sector-title">${sectorData.sectorLabel}</div>
                        <div class="valve-badge">Válvula ${sectorData.valve}</div>
                    </div>

                    <div class="valve-section">
                        <div class="valve-box">
                            <div class="valve-header">
                                <div class="valve-title">
                                    <div class="valve-status-light ${data.status ? 'running' : 'stopped'}"></div>
                                    🚿 Válvula ${sectorData.valve}
                                </div>
                                <div class="mode-badge ${getModeClass(data.mode)}">
                                    ${getModeText(data.mode)}
                                </div>
                            </div>

                            <div class="flow-display">
                                <div class="flow-value">
                                    ${formatFlow(data.flow)}
                                    <span class="flow-unit">l/s</span>
                                </div>
                            </div>

                            <div class="metrics-grid">
                                <div class="metric-item">
                                    <div class="metric-label">Total Acumulado</div>
                                    <div class="metric-value">${formatCounter(data.total)} m³</div>
                                </div>
                                <div class="metric-item">
                                    <div class="metric-label">Consumo Diario</div>
                                    <div class="metric-value">${formatCounter(data.daily)} m³</div>
                                </div>
                            </div>

                            <div class="controls">
                                <button class="btn" onclick="resetDaily()">🔄 Reset Diario</button>
                                <button class="btn" onclick="resetTotal()">🗑️ Reset Total</button>
                            </div>
                        </div>
                    </div>

                    <div class="last-update">
                        Última actualización: ${sectorData.lastUpdate}
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // Actualizar datos
        async function refreshData() {
            try {
                updateConnectionStatus(true, 'Actualizando...');
                sectorData = await obtenerDatosSector();
                renderSector();
                updateConnectionStatus(true, 'Conectado');
            } catch (error) {
                console.error('Error actualizando datos:', error);
                updateConnectionStatus(false, 'Error de conexión');
            }
        }

        // Reintentar conexión
        function reintentar() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            setTimeout(init, 1000);
        }

        // Enviar comando a Node-RED
        async function enviarComando(action, params = {}) {
            try {
                const url = `${nodeRedUrl}/api/sector/${currentSector}/${currentValve}/command`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentUser.token}`
                    },
                    body: JSON.stringify({
                        action,
                        sector: currentSector,
                        valve: currentValve,
                        ...params
                    })
                });

                if (response.ok) {
                    // Actualizar datos después del comando
                    setTimeout(refreshData, 1000);
                    return true;
                } else {
                    throw new Error('Error enviando comando');
                }
            } catch (error) {
                console.error('Error enviando comando:', error);
                alert('Error enviando comando. Verifica la conexión.');
                return false;
            }
        }

        // Reset diario
        async function resetDaily() {
            if (confirm('¿Seguro que quieres resetear el contador diario?')) {
                await enviarComando('reset_daily');
            }
        }

        // Reset total
        async function resetTotal() {
            if (confirm('¿Seguro que quieres resetear COMPLETAMENTE el contador total?\n(Se perderán todos los datos acumulados)')) {
                await enviarComando('reset_total', { confirm: true });
            }
        }

        // Configurar URL de Node-RED
        document.getElementById('node-red-url').addEventListener('change', (e) => {
            nodeRedUrl = e.target.value.trim();
            localStorage.setItem('nodeRedUrl', nodeRedUrl);
        });

        // Inicialización
        async function init() {
            // Cargar URL guardada
            const savedUrl = localStorage.getItem('nodeRedUrl');
            if (savedUrl) {
                nodeRedUrl = savedUrl;
                document.getElementById('node-red-url').value = savedUrl;
            }

            if (!validateUser()) {
                return;
            }

            showUserInfo();
            document.getElementById('loading').style.display = 'none';
            
            // Cargar datos iniciales
            await refreshData();
            
            // Actualizar cada 30 segundos
            updateInterval = setInterval(refreshData, 30000);
        }

        // Iniciar cuando se carga la página
        document.addEventListener('DOMContentLoaded', init);

        // Limpiar interval al cerrar
        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
</html>
