<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <title>MEMAC Irrigation Control APP</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top, #020617 0, #000 75%);
            min-height: 100vh;
            color: #e5e7eb;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .container {
            max-width: 600px;
            padding: 16px 12px 80px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 18px 14px;
            background: rgba(15,23,42,0.95);
            border-radius: 18px;
            border: 1px solid rgba(30,64,175,0.7);
            box-shadow: 0 16px 40px rgba(15,23,42,0.9);
        }

        .header h1 {
            font-size: 1.4em;
            margin-bottom: 6px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #a5b4fc;
        }

        .header p {
            font-size: 0.9em;
            opacity: 0.8;
            color: #94a3b8;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 12px 14px;
            background: rgba(15,23,42,0.96);
            border-radius: 14px;
            border: 1px solid rgba(30,64,175,0.7);
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-badge {
            background: linear-gradient(120deg, #22c55e, #16a34a);
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.85em;
            color: #ecfdf5;
            box-shadow: 0 8px 18px rgba(22,163,74,0.8);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
            color: #9ca3af;
        }

        .status-light {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .status-light.offline {
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
        }

        .sector-card {
            background: rgba(15,23,42,0.96);
            border: 1px solid rgba(30,64,175,0.7);
            border-radius: 20px;
            padding: 18px 16px 16px;
            margin-bottom: 18px;
            box-shadow: 0 18px 48px rgba(15,23,42,0.9);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(51,65,85,0.8);
            flex-wrap: wrap;
            gap: 10px;
        }

        .sector-title {
            font-size: 1.1em;
            font-weight: 700;
            color: #e5e7eb;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .valve-badge {
            background: radial-gradient(circle at 20% 0, #38bdf8 0, #0ea5e9 45%, #0369a1 100%);
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.85em;
            color: #e0f2fe;
            box-shadow: 0 10px 24px rgba(8,145,178,0.9);
        }

        .valve-section {
            margin-top: 10px;
        }

        .valve-box {
            background: radial-gradient(circle at top left, rgba(15,23,42,0.9) 0, rgba(15,23,42,0.98) 55%);
            border: 1px solid rgba(51,65,85,0.9);
            border-radius: 16px;
            padding: 16px 14px 14px;
            margin-bottom: 12px;
        }

        .valve-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .valve-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1em;
        }

        .valve-status-light {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(15,23,42,1);
            transition: all 0.4s ease;
        }

        .valve-status-light.running {
            background: #22c55e;
            box-shadow: 0 0 15px #22c55e, 0 0 30px rgba(34,197,94,0.6);
            border-color: #22c55e;
        }

        .valve-status-light.stopped {
            background: #ef4444;
            box-shadow: 0 0 15px #ef4444, 0 0 30px rgba(239,68,68,0.6);
            border-color: #ef4444;
        }

        .flow-display {
            text-align: center;
            margin: 18px 0;
            padding: 18px 10px;
            background: radial-gradient(circle at top, rgba(15,23,42,0.4) 0, rgba(15,23,42,0.9) 70%);
            border-radius: 14px;
            border: 1px solid rgba(30,64,175,0.6);
        }

        .flow-value {
            font-size: 2.6em;
            font-weight: 800;
            color: #22d3ee;
            text-shadow: 0 0 18px rgba(34,211,238,0.7);
            line-height: 1;
        }

        .flow-unit {
            color: #9ca3af;
            font-size: 0.4em;
            margin-left: 5px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 12px 0 4px;
        }

        .metric-item {
            text-align: center;
            padding: 10px 6px;
            background: rgba(15,23,42,0.9);
            border-radius: 12px;
            border: 1px solid rgba(55,65,81,0.9);
        }

        .metric-label {
            font-size: 0.78em;
            color: #9ca3af;
            margin-bottom: 6px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 1.1em;
            font-weight: 700;
            color: #e5e7eb;
        }

        .mini-chart {
            margin: 10px 0 4px;
            padding: 8px 6px 4px;
            background: rgba(15,23,42,0.9);
            border-radius: 12px;
            border: 1px solid rgba(55,65,81,0.9);
        }

        .mini-chart-title {
            font-size: 0.76em;
            color: #9ca3af;
            margin-bottom: 6px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
        }

        .mini-chart canvas {
            width: 100%;
            display: block;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
        }

        .btn {
            background: linear-gradient(135deg, rgba(15,23,42,0.1), rgba(15,23,42,0.6));
            border: 1px solid rgba(55,65,81,0.9);
            color: #e5e7eb;
            border-radius: 10px;
            padding: 11px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85em;
            font-weight: 500;
            text-align: center;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.96);
            background: linear-gradient(135deg, rgba(30,64,175,0.6), rgba(15,23,42,0.9));
            border-color: rgba(37,99,235,0.9);
        }

        .mode-badge {
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.8em;
            font-weight: 600;
            border: 1px solid rgba(55,65,81,0.9);
        }

        .mode-auto { background: rgba(37,99,235,0.3); color: #60a5fa; }
        .mode-manual { background: rgba(22,163,74,0.25); color: #4ade80; }
        .mode-off { background: rgba(148,163,184,0.25); color: #e5e7eb; }

        .error-message {
            text-align: center;
            padding: 24px 18px;
            background: rgba(127,29,29,0.2);
            border: 1px solid rgba(248,113,113,0.6);
            border-radius: 15px;
            color: #fecaca;
            margin: 18px 0;
        }

        .loading {
            text-align: center;
            padding: 34px 18px;
            font-size: 1.05em;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(148,163,184,0.4);
            border-top: 4px solid #e5e7eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 18px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: radial-gradient(circle at 20% 0, #22c55e 0, #16a34a 45%, #166534 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 16px 40px rgba(22,163,74,0.9);
            transition: all 0.2s ease;
            z-index: 1000;
            touch-action: manipulation;
        }

        .refresh-btn:active {
            transform: scale(0.92) translateY(2px);
        }

        .last-update {
            text-align: center;
            margin-top: 12px;
            color: #9ca3af;
            font-size: 0.78em;
            padding: 8px;
            background: rgba(15,23,42,0.9);
            border-radius: 8px;
            border: 1px solid rgba(55,65,81,0.9);
        }

        .connection-config {
            background: rgba(15,23,42,0.96);
            border-radius: 14px;
            padding: 14px 12px;
            margin-bottom: 16px;
            font-size: 0.9em;
            border: 1px solid rgba(30,64,175,0.7);
        }

        .connection-config label {
            display: block;
            margin-bottom: 6px;
            color: #9ca3af;
            font-size: 0.88em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .config-input {
            width: 100%;
            background: rgba(15,23,42,0.9);
            border: 1px solid rgba(55,65,81,0.9);
            color: #e5e7eb;
            border-radius: 8px;
            padding: 10px 9px;
            font-size: 0.9em;
            margin-top: 2px;
        }

        .config-input::placeholder {
            color: rgba(148,163,184,0.7);
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px 8px 80px;
            }
            
            .flow-value {
                font-size: 2.3em;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            .user-info {
                flex-direction: column;
                text-align: center;
                align-items: flex-start;
            }
            
            .user-info > div {
                width: 100%;
            }
            
            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        .install-prompt {
            background: rgba(22,163,74,0.18);
            border: 1px solid rgba(34,197,94,0.5);
            border-radius: 12px;
            padding: 14px 12px;
            margin-bottom: 18px;
            text-align: center;
            display: none;
            color: #bbf7d0;
        }

        .install-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MEMAC Irrigation Control APP</h1>
            <p>Control y visualización del sistema de riego</p>
        </div>

        <div id="install-prompt" class="install-prompt">
            <div>📱 Instala MEMAC en tu móvil</div>
            <button id="install-btn" class="install-btn">Instalar App</button>
        </div>

        <div class="connection-config">
            <label>🔗 Servidor MEMAC:</label>
            <input type="text" id="node-red-url" class="config-input" 
                   placeholder="http://tu-servidor.com:1880" 
                   value="http://localhost:1880">
        </div>

        <div id="user-info" class="user-info" style="display: none;">
            <div>
                <span class="user-badge" id="user-badge">Usuario: ---</span>
            </div>
            <div class="status-indicator">
                <div class="status-light" id="connection-status"></div>
                <span id="connection-text">Conectando...</span>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <div>Cargando datos de tu instalación...</div>
        </div>

        <div id="error" class="error-message" style="display: none;">
            <h3>❌ Error de Conexión</h3>
            <p id="error-message">No se pudo conectar con el servidor.</p>
            <button class="btn" onclick="reintentar()" style="margin-top: 15px; width: auto; display: inline-block;">
                🔄 Reintentar
            </button>
        </div>

        <div id="sector-container"></div>
    </div>

    <button class="refresh-btn" onclick="refreshData()" title="Actualizar datos">
        🔄
    </button>

    <script src="usuarios-sectores-config.js"></script>
    <script>
        let currentUser = null;
        let currentSector = null;
        let currentValve = null;
        let sectorData = null;
        let nodeRedUrl = 'http://localhost:1880';
        let updateInterval = null;

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-prompt').style.display = 'block';
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('install-prompt').style.display = 'none';
            }
        });

        function getURLParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                user: params.get('user'),
                token: params.get('token')
            };
        }

        function validateUser() {
            const { user, token } = getURLParams();
            
            if (!user || !token) {
                showError('URL inválida. Faltan parámetros de usuario o token.');
                return false;
            }

            if (user === 'admin' && token === 'admin_master_2024_secure') {
                window.location.href = 'admin.html?user=admin&token=admin_master_2024_secure';
                return false;
            }

            const validation = validarAccesoSector(user, token);
            if (!validation.valido) {
                showError(validation.error);
                return false;
            }

            currentUser = {
                id: user,
                name: validation.usuario,
                sector: validation.sector,
                valve: validation.valve,
                sectorLabel: validation.sectorLabel,
                token: token
            };
            
            currentSector = validation.sector;
            currentValve = validation.valve;
            return true;
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent = message;
            updateConnectionStatus(false, 'Error');
        }

        function showUserInfo() {
            const userInfo = document.getElementById('user-info');
            const userBadge = document.getElementById('user-badge');
            
            userBadge.textContent = `${currentUser.name} - ${currentUser.sectorLabel} ${currentUser.valve}`;
            userInfo.style.display = 'flex';
        }

        function updateConnectionStatus(connected, text = '') {
            const statusLight = document.getElementById('connection-status');
            const statusText = document.getElementById('connection-text');
            
            if (connected) {
                statusLight.classList.remove('offline');
                statusText.textContent = text || 'Conectado';
            } else {
                statusLight.classList.add('offline');
                statusText.textContent = text || 'Sin conexión';
            }
        }

        async function obtenerDatosSector() {
            try {
                const url = `${nodeRedUrl}/api/sector/${currentSector}/${currentValve}`;
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentUser.token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                return await response.json();
            } catch (error) {
                console.error('Error obteniendo datos:', error);
                return generarDatosSimulados();
            }
        }

        function generarDatosSimulados() {
            return {
                sector: currentSector,
                valve: currentValve,
                sectorLabel: currentUser.sectorLabel,
                data: {
                    flow: Math.random() * 10,
                    total: Math.random() * 1000,
                    daily: Math.random() * 50,
                    status: Math.random() > 0.5,
                    mode: Math.floor(Math.random() * 3)
                },
                lastUpdate: new Date().toLocaleString(),
                simulated: true
            };
        }

        function formatFlow(flow) {
            return (flow * 1000 / 3600).toFixed(2);
        }

        function formatCounter(value) {
            return value.toFixed(1).padStart(8, '0');
        }

        function getModeText(mode) {
            switch(mode) {
                case 0: return 'OFF';
                case 1: return 'MANUAL';
                case 2: return 'AUTO';
                default: return '---';
            }
        }

        function getModeClass(mode) {
            switch(mode) {
                case 0: return 'mode-off';
                case 1: return 'mode-manual';
                case 2: return 'mode-auto';
                default: return 'mode-off';
            }
        }

        function getMiniChartData(dailyValue) {
            const base = Number(dailyValue) || 0;
            const points = [];
            for (let i = 6; i >= 0; i--) {
                const factor = 0.6 + Math.random() * 0.8;
                points.push(Number((base * factor).toFixed(2)));
            }
            return points;
        }

        function drawMiniConsumptionChart(dailyValue) {
            const canvas = document.getElementById('memac-consumption-chart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const width = canvas.offsetWidth || 300;
            canvas.width = width;
            canvas.height = 80;

            const w = canvas.width;
            const h = canvas.height;
            const padding = 8;
            const values = getMiniChartData(dailyValue);
            const max = Math.max(...values, 1);

            ctx.clearRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(71,85,105,0.8)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding, h - padding);
            ctx.lineTo(w - padding, h - padding);
            ctx.stroke();

            const stepX = (w - padding * 2) / (values.length - 1);

            ctx.beginPath();
            values.forEach((v, i) => {
                const x = padding + i * stepX;
                const y = h - padding - ((v / max) * (h - padding * 2));
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.lineTo(w - padding, h - padding);
            ctx.lineTo(padding, h - padding);
            ctx.closePath();
            ctx.fillStyle = 'rgba(34,197,94,0.12)';
            ctx.fill();

            values.forEach((v, i) => {
                const x = padding + i * stepX;
                const y = h - padding - ((v / max) * (h - padding * 2));
                ctx.beginPath();
                ctx.arc(x, y, i === values.length - 1 ? 3.5 : 2.2, 0, Math.PI * 2);
                ctx.fillStyle = i === values.length - 1 ? '#4ade80' : '#22c55e';
                ctx.fill();
            });
        }

        function renderSector() {
            if (!sectorData) return;

            const container = document.getElementById('sector-container');
            const data = sectorData.data;
            
            const simulatedWarning = sectorData.simulated
                ? '<div style="background: rgba(245,158,11,0.18); padding: 9px; border-radius: 8px; margin-bottom: 10px; text-align: center; font-size: 0.86em; border:1px solid rgba(245,158,11,0.7); color:#fed7aa;">⚠️ Datos simulados - Verificar conexión Node-RED</div>'
                : '';
            
            const html = `
                <div class="sector-card">
                    ${simulatedWarning}
                    <div class="card-header">
                        <div class="sector-title">${sectorData.sectorLabel}</div>
                        <div class="valve-badge">Válvula ${sectorData.valve}</div>
                    </div>

                    <div class="valve-section">
                        <div class="valve-box">
                            <div class="valve-header">
                                <div class="valve-title">
                                    <div class="valve-status-light ${data.status ? 'running' : 'stopped'}"></div>
                                    🚿 Válvula ${sectorData.valve}
                                </div>
                                <div class="mode-badge ${getModeClass(data.mode)}">
                                    ${getModeText(data.mode)}
                                </div>
                            </div>

                            <div class="flow-display">
                                <div class="flow-value">
                                    ${formatFlow(data.flow)}
                                    <span class="flow-unit">l/s</span>
                                </div>
                            </div>

                            <div class="metrics-grid">
                                <div class="metric-item">
                                    <div class="metric-label">Total Acumulado</div>
                                    <div class="metric-value">${formatCounter(data.total)} m³</div>
                                </div>
                                <div class="metric-item">
                                    <div class="metric-label">Consumo Diario</div>
                                    <div class="metric-value">${formatCounter(data.daily)} m³</div>
                                </div>
                            </div>

                            <div class="mini-chart">
                                <div class="mini-chart-title">m³ consumidos recientes</div>
                                <canvas id="memac-consumption-chart"></canvas>
                            </div>

                            <div class="controls">
                                <button class="btn" onclick="resetDaily()">🔄 Reset Diario</button>
                                <button class="btn" onclick="resetTotal()">🗑️ Reset Total</button>
                            </div>
                        </div>
                    </div>

                    <div class="last-update">
                        Última actualización: ${sectorData.lastUpdate}
                    </div>
                </div>
            `;

            container.innerHTML = html;
            drawMiniConsumptionChart(data.daily);
        }

        async function refreshData() {
            try {
                updateConnectionStatus(true, 'Actualizando...');
                sectorData = await obtenerDatosSector();
                renderSector();
                updateConnectionStatus(true, 'Conectado');
            } catch (error) {
                console.error('Error actualizando datos:', error);
                updateConnectionStatus(false, 'Error de conexión');
            }
        }

        function reintentar() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            setTimeout(init, 1000);
        }

        async function enviarComando(action, params = {}) {
            try {
                const url = `${nodeRedUrl}/api/sector/${currentSector}/${currentValve}/command`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentUser.token}`
                    },
                    body: JSON.stringify({
                        action,
                        sector: currentSector,
                        valve: currentValve,
                        ...params
                    })
                });

                if (response.ok) {
                    setTimeout(refreshData, 1000);
                    return true;
                } else {
                    throw new Error('Error enviando comando');
                }
            } catch (error) {
                console.error('Error enviando comando:', error);
                alert('Error enviando comando. Verifica la conexión.');
                return false;
            }
        }

        async function resetDaily() {
            if (confirm('¿Seguro que quieres resetear el contador diario?')) {
                await enviarComando('reset_daily');
            }
        }

        async function resetTotal() {
            if (confirm('¿Seguro que quieres resetear COMPLETAMENTE el contador total?\n(Se perderán todos los datos acumulados)')) {
                await enviarComando('reset_total', { confirm: true });
            }
        }

        document.getElementById('node-red-url').addEventListener('change', (e) => {
            nodeRedUrl = e.target.value.trim();
            try {
                localStorage.setItem('nodeRedUrl', nodeRedUrl);
            } catch (e) {
                console.warn('No se pudo guardar nodeRedUrl');
            }
        });

        async function init() {
            try {
                const savedUrl = localStorage.getItem('nodeRedUrl');
                if (savedUrl) {
                    nodeRedUrl = savedUrl;
                    document.getElementById('node-red-url').value = savedUrl;
                }
            } catch (e) {
                console.warn('No se pudo leer nodeRedUrl guardada');
            }

            if (!validateUser()) {
                return;
            }

            showUserInfo();
            document.getElementById('loading').style.display = 'none';
            await refreshData();
            updateInterval = setInterval(refreshData, 30000);
        }

        document.addEventListener('DOMContentLoaded', init);

        window.addEventListener('resize', () => {
            if (sectorData && sectorData.data) {
                drawMiniConsumptionChart(sectorData.data.daily);
            }
        });

        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
</html>
