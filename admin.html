<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMAC Admin Access</title>
    <meta name="theme-color" content="#020617">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #020617;
            --bg-soft: #0f172a;
            --panel: rgba(15,23,42,0.96);
            --line: rgba(51,65,85,0.95);
            --text: #e5e7eb;
            --muted: #94a3b8;
            --blue: #3b82f6;
            --green: #22c55e;
            --amber: #f59e0b;
            --red: #ef4444;
            --radius: 22px;
            --shadow: 0 24px 60px rgba(0,0,0,0.45);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #0b1220 0%, #020617 45%, #000 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(17,24,39,0.98));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 26px 22px;
        }

        .top-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(245,158,11,0.16);
            border: 1px solid rgba(245,158,11,0.35);
            color: #fde68a;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.45rem;
            color: #c7d2fe;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .status-box {
            border-radius: 16px;
            padding: 14px 14px;
            margin-bottom: 18px;
            border: 1px solid var(--line);
            background: rgba(15,23,42,0.72);
            color: var(--muted);
            font-size: 0.92rem;
        }

        .status-box.ok {
            background: rgba(34,197,94,0.14);
            border-color: rgba(34,197,94,0.38);
            color: #bbf7d0;
        }

        .status-box.warn {
            background: rgba(245,158,11,0.14);
            border-color: rgba(245,158,11,0.38);
            color: #fde68a;
        }

        .status-box.error {
            background: rgba(239,68,68,0.14);
            border-color: rgba(239,68,68,0.38);
            color: #fecaca;
        }

        .form-grid {
            display: grid;
            gap: 14px;
            margin-bottom: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        input {
            width: 100%;
            background: rgba(15,23,42,0.95);
            color: var(--text);
            border: 1px solid rgba(51,65,85,0.95);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: rgba(59,130,246,0.95);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .btn {
            border: 1px solid rgba(51,65,85,0.9);
            background: linear-gradient(180deg, rgba(30,41,59,0.95), rgba(15,23,42,0.98));
            color: var(--text);
            border-radius: 14px;
            padding: 12px 14px;
            cursor: pointer;
            font-size: 0.92rem;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            border-color: rgba(59,130,246,0.9);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(34,197,94,0.22), rgba(21,128,61,0.18));
            border-color: rgba(34,197,94,0.45);
        }

        .btn-secondary {
            background: linear-gradient(135deg, rgba(59,130,246,0.20), rgba(37,99,235,0.18));
            border-color: rgba(59,130,246,0.45);
        }

        .help {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(51,65,85,0.7);
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.5;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color: #93c5fd;
            word-break: break-all;
        }

        @media (max-width: 560px) {
            .card {
                padding: 20px 16px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="top-badge">🔐 Acceso Administrador</div>
        <h1>MEMAC Admin</h1>
        <p class="subtitle">
            Validación de acceso al panel de administración del sistema de riego.
        </p>

        <div id="statusBox" class="status-box">
            Comprobando parámetros de acceso...
        </div>

        <form id="adminForm" class="form-grid">
            <div class="form-group">
                <label for="adminUser">Usuario</label>
                <input type="text" id="adminUser" value="admin" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="adminToken">Token administrador</label>
                <input type="password" id="adminToken" placeholder="Introduce el token maestro" autocomplete="current-password">
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Entrar al panel</button>
                <button type="button" class="btn btn-secondary" onclick="rellenarDesdeURL()">Usar token de la URL</button>
            </div>
        </form>

        <div class="help">
            Panel destino: <span class="mono">admin-panel-2.html</span><br>
            Si entras desde la app cliente con <span class="mono">user=admin</span>, esta pantalla valida y redirige al panel. [file:159][file:155]
        </div>
    </main>

    <script>
        const ADMIN_USER = 'admin';
        const ADMIN_TOKEN = 'admin_master_2024_secure';

        function getURLParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                user: params.get('user'),
                token: params.get('token')
            };
        }

        function setStatus(message, type = '') {
            const box = document.getElementById('statusBox');
            box.className = 'status-box';
            if (type) box.classList.add(type);
            box.textContent = message;
        }

        function credencialesValidas(user, token) {
            return user === ADMIN_USER && token === ADMIN_TOKEN;
        }

        function construirURLPanel() {
            const base = window.location.pathname.replace('admin.html', 'admin-panel-2.html');
            return `${window.location.origin}${base}?user=${encodeURIComponent(ADMIN_USER)}&token=${encodeURIComponent(ADMIN_TOKEN)}`;
        }

        function irAlPanel() {
            window.location.href = construirURLPanel();
        }

        function rellenarDesdeURL() {
            const { user, token } = getURLParams();

            if (user) document.getElementById('adminUser').value = user;
            if (token) document.getElementById('adminToken').value = token;

            if (user || token) {
                setStatus('Se han cargado las credenciales desde la URL.', 'warn');
            } else {
                setStatus('La URL no contiene credenciales de administrador.', 'error');
            }
        }

        function validarAccesoAutomatico() {
            const { user, token } = getURLParams();

            if (!user && !token) {
                setStatus('Introduce las credenciales de administrador para continuar.', 'warn');
                return;
            }

            if (credencialesValidas(user, token)) {
                setStatus('Credenciales válidas. Redirigiendo al panel...', 'ok');
                setTimeout(irAlPanel, 700);
            } else {
                setStatus('La URL contiene credenciales no válidas para administrador.', 'error');
                rellenarDesdeURL();
            }
        }

        document.getElementById('adminForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const user = document.getElementById('adminUser').value.trim();
            const token = document.getElementById('adminToken').value.trim();

            if (!user || !token) {
                setStatus('Debes indicar usuario y token.', 'error');
                return;
            }

            if (!credencialesValidas(user, token)) {
                setStatus('Usuario o token de administrador no válidos.', 'error');
                return;
            }

            setStatus('Acceso correcto. Abriendo panel de administración...', 'ok');
            setTimeout(irAlPanel, 500);
        });

        document.addEventListener('DOMContentLoaded', validarAccesoAutomatico);
    </script>
</body>
</html>
